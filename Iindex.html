<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tic-Tac-Toe Game</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main>

        <h1
            class ="game-title">
            <span class="title-x">X</span>
            TIC TAC
            <span class="title-toe"> TOE</span>
            <span class="title-o">O</span>
        </h1>

        <div class="game-mode">

            <button id="pvp-btn" class="mode-btn active">
                👥 Player vs Player
            </button>

            <button id="pvc-btn" class="mode-btn">
                🤖 Player vs Computer
            </button>

        </div>

        <div class="container">

            <div class="game">

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <div class="winning-line"></div>

            </div>

            <div class="msg-container hide">
                <p id="msg"></p>
            </div>

            <button id="reset-btn">Reset Game</button>

            <button id="new-btn" class="hide">
                New Game
            </button>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
